name: Android build

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gradle wrapper JAR mora biti zvaničan (zaštita od podmetnutog gradle-wrapper.jar).
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        # Podrazumevani paket 'tools' više ne postoji u SDK-u (sdkmanager pada); ostalo instalira sledeći korak.
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # release buildType je potpisan debug ključem (vidi app/build.gradle.kts),
      # pa assembleRelease daje instalabilan app-release.apk bez pravog keystore-a.
      - name: Unit tests + detekt + lint + assemble release
        run: ./gradlew testDebugUnitTest detekt lintDebug koverVerifyDebug assembleRelease -PallowDebugSigning=true --no-daemon --stacktrace

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rad-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/roborazzi/
          if-no-files-found: ignore

  # Snimci su snimljeni na Windows-u, a Linux renderer se razlikuje u par piksela, pa se strogo
  # proveravaju na Windows ranneru: razlika obara build.
  screenshots:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Snimci ekrana (Roborazzi)
        shell: bash
        run: ./gradlew verifyRoborazziDebug -PallowDebugSigning=true --no-daemon

      - name: Upload razlike
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-diff
          path: app/build/outputs/roborazzi/
          if-no-files-found: ignore
