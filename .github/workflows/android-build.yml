name: Android build

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # gradle.properties pinuje Windows JDK putanju (lokalni dev je na Windows-u);
      # na Linux ranneru je neutralizujemo da Gradle koristi JDK iz setup-java.
      - name: Neutralize Windows java.home
        run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # release buildType je potpisan debug ključem (vidi app/build.gradle.kts),
      # pa assembleRelease daje instalabilan app-release.apk bez pravog keystore-a.
      - name: Unit tests + detekt + lint + assemble release
        run: ./gradlew testDebugUnitTest detekt lintDebug koverVerifyDebug assembleRelease -PallowDebugSigning=true --no-daemon --stacktrace

      # Snimci su snimljeni na Windows-u; Linux renderer može da se razlikuje u par piksela, pa korak
      # ne obara build, a razlike (app/build/outputs/roborazzi) idu u build-reports. Lokalno ih
      # release.ps1 proverava strogo.
      - name: Snimci ekrana (Roborazzi)
        continue-on-error: true
        run: ./gradlew verifyRoborazziDebug -PallowDebugSigning=true --no-daemon

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rad-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/roborazzi/
          if-no-files-found: ignore
