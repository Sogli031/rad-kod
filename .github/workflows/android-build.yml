name: Android build

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gradle wrapper JAR mora biti zvaničan (zaštita od podmetnutog gradle-wrapper.jar).
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Keš sa main grane koristi i release (tag), pa ne gradi sve iz početka.
      - name: Set up Gradle (keš)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        # Podrazumevani paket 'tools' više ne postoji u SDK-u (sdkmanager pada); ostalo instalira sledeći korak.
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          # Ime platforme može imati i manju verziju (npr. android-37.0): uzima se ono koje SDK nudi.
          platform=$(sdkmanager --list 2>/dev/null | grep -oE 'platforms;android-37(\.[0-9]+)?' | sort -V | tail -n 1)
          if [ -z "$platform" ]; then sdkmanager --list 2>/dev/null | grep "platforms;android-3"; echo "::error::SDK ne nudi platformu android-37"; exit 1; fi
          sdkmanager "platform-tools" "$platform" "build-tools;36.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Brza provera: testovi, detekt, lint i debug build. R8 (assembleRelease) radi samo release.yml.
      - name: Unit tests + detekt + lint + assemble debug
        run: ./gradlew testDebugUnitTest detekt lintDebug assembleDebug -PallowDebugSigning=true --no-daemon --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rad-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

