name: Tmp record snapshots

# Privremeno: ponovo snima referentne snimke ekrana (Windows) i komituje ih na granu.
on:
  push:
    branches:
      - claude/ai-annual-leave-planner-hnyv8w
    paths:
      - .github/workflows/tmp-record-snapshots.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Snimi
        shell: bash
        run: ./gradlew recordRoborazziDebug -PallowDebugSigning=true --no-daemon
      - name: Komituj snimke
        shell: bash
        run: |
          git status --short app/src/test/snapshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test/snapshots
          git rm -q .github/workflows/tmp-record-snapshots.yml
          git commit -m "Snimci ekrana: akontacija sa mesecom isplate"
          git push origin HEAD:claude/ai-annual-leave-planner-hnyv8w
