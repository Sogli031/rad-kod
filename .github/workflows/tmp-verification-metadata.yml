name: Tmp verification metadata

# Privremeno: upisuje otiske zavisnosti koji fale u verification-metadata.xml i ispisuje razliku.
on:
  push:
    branches:
      - claude/ai-annual-leave-planner-hnyv8w
    paths:
      - .github/workflows/tmp-verification-metadata.yml

jobs:
  metadata:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Otisci
        shell: bash
        run: >
          ./gradlew --write-verification-metadata sha256 --no-configuration-cache --no-daemon
          -PallowDebugSigning=true --continue
          testDebugUnitTest verifyRoborazziDebug detekt lintDebug koverVerifyDebug assembleRelease
          :app:assembleBenchmark :baselineprofile:assembleBenchmark || true
      - name: Razlika
        shell: bash
        run: |
          echo "=====DIFF-START====="
          git diff --no-color -U0 gradle/verification-metadata.xml
          echo "=====DIFF-END====="
