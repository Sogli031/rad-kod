name: Release

# Isto što i release.ps1, ali bez ovog računara: ključ za potpisivanje i Gemini ključ dolaze iz
# GitHub Secrets. Pokreće se push-om taga vX.Y (X.Y = versionName); ručno pokretanje bez
# "publish" samo proverava build i potpis.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Objavi release na Sogli031/rad'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  EXPECTED_SHA1: 1ba8c0aab7cd5be3af2c1099443d5c6375b06b55
  PUBLIC_REPO: Sogli031/rad
  BUILD_TOOLS: '36.0.0'

jobs:
  # Isti commit uz push na main proverava "Android build" (testovi, detekt, lint, debug build).
  # Kad taj build postoji, release ne ponavlja provere: pravi APK paralelno i pre objave čeka da
  # Android build prođe. Bez njega (npr. tag na commitu koji nije na main) sve se proverava ovde.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      covered: ${{ steps.find.outputs.covered }}
    steps:
      - name: Android build za ovaj commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          covered=false
          # Push main-a i taga stižu skoro zajedno; run se ponekad pojavi tek posle par sekundi.
          for i in $(seq 1 12); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/android-build.yml/runs?head_sha=$GITHUB_SHA&event=push" --jq '.total_count')
            if [ "${count:-0}" -gt 0 ]; then covered=true; break; fi
            sleep 10
          done
          echo "Android build pokriva $GITHUB_SHA: $covered"
          echo "covered=$covered" >> "$GITHUB_OUTPUT"

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Verzija i beleške iz CHANGELOG.md
        id: version
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$version" ]; then echo "::error::versionName nije nađen"; exit 1; fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME ne odgovara versionName $version"; exit 1
          fi
          # Odeljak "## [verzija]" do sledećeg "## [".
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::CHANGELOG.md nema odeljak za verziju $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (keš)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        # Podrazumevani paket 'tools' više ne postoji u SDK-u (sdkmanager pada); ostalo instalira sledeći korak.
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          # Ime platforme može imati i manju verziju (npr. android-37.0): uzima se ono koje SDK nudi.
          platform=$(sdkmanager --list 2>/dev/null | grep -oE 'platforms;android-37(\.[0-9]+)?' | sort -V | tail -n 1)
          if [ -z "$platform" ]; then sdkmanager --list 2>/dev/null | grep "platforms;android-3"; echo "::error::SDK ne nudi platformu android-37"; exit 1; fi
          sdkmanager "platform-tools" "$platform" "build-tools;$BUILD_TOOLS"

      # ../keystore/ kao na računaru (Desktop\programi\keystore): signing.gradle, release.jks,
      # keystore.properties. Tajne idu kroz env i nikad se ne štampaju.
      - name: Ključ za potpisivanje i local.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD GEMINI_API_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Nedostaje tajna za $name"; exit 1; fi
          done
          ks="$GITHUB_WORKSPACE/../keystore"
          mkdir -p "$ks"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ks/release.jks"
          {
            echo "storeFile=release.jks"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > "$ks/keystore.properties"
          printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > local.properties
          cat > "$ks/signing.gradle" <<'EOF'
          // Zajednički potpis za sve Android projekte u Desktop\programi.
          // Ključ se upisuje u "debug" signingConfig, pa njime idu i debug i release
          // build-ovi (release u projektima koristi signingConfigs.getByName("debug")).
          // Uključuje se iz app/build.gradle(.kts) svakog projekta.
          def ksDir = buildscript.sourceFile.parentFile
          def propsFile = new File(ksDir, 'keystore.properties')

          if (propsFile.exists()) {
              def props = new Properties()
              propsFile.withInputStream { props.load(it) }
              def jks = new File(props.getProperty('storeFile'))
              if (!jks.absolute) jks = new File(ksDir, props.getProperty('storeFile'))

              android.signingConfigs.getByName('debug') {
                  storeFile jks
                  storePassword props.getProperty('storePassword')
                  keyAlias props.getProperty('keyAlias')
                  keyPassword props.getProperty('keyPassword')
              }
          } else {
              logger.warn("Nema ${propsFile}, potpisuje se podrazumevanim debug ključem.")
          }
          EOF

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Bez -PallowDebugSigning: ako ključa nema, build pada umesto da potpiše debug ključem.
      - name: Testovi, detekt, lint, assembleRelease
        if: needs.ci.outputs.covered != 'true'
        run: ./gradlew testDebugUnitTest detekt lintDebug assembleRelease --no-daemon --stacktrace

      - name: assembleRelease (provere radi Android build)
        if: needs.ci.outputs.covered == 'true'
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Provera potpisa i 16 KB poravnanja
        id: verify
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          certs=$("$tools/apksigner" verify --print-certs "$apk")
          sha1=$(printf '%s\n' "$certs" | sed -n 's/.*SHA-1 digest: \([0-9a-f]*\).*/\1/p' | head -n 1)
          if [ "$sha1" != "$EXPECTED_SHA1" ]; then
            echo "::error::Pogrešan potpisni ključ: $sha1"; exit 1
          fi
          "$tools/zipalign" -c -P 16 4 "$apk" || { echo "::error::APK nije poravnat na 16 KB"; exit 1; }
          mkdir -p release-out
          cp "$apk" release-out/rad.apk
          cp app/build/outputs/mapping/release/mapping.txt "release-out/mapping-v${{ steps.version.outputs.version }}.txt"
          sha256=$(sha256sum release-out/rad.apk | cut -d' ' -f1)
          echo "APK SHA-256: $sha256  potpis SHA-1: $sha1"
          printf '\n\nSHA-256 APK-a: `%s`\nSHA-1 sertifikata: `%s`\n' "$sha256" "$sha1" >> "$RUNNER_TEMP/notes.md"

      # mapping.txt ostaje u privatnom repou (artefakt workflow-a), ne ide u javni release.
      - name: Upload APK i mapping
        uses: actions/upload-artifact@v4
        with:
          name: rad-v${{ steps.version.outputs.version }}
          path: release-out/
          retention-days: 90

      # Objava samo ako je Android build za isti commit prošao (testovi, detekt, lint, debug build).
      - name: Čekaj Android build
        if: needs.ci.outputs.covered == 'true'
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while true; do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/android-build.yml/runs?head_sha=$GITHUB_SHA&event=push"               --jq '.workflow_runs | sort_by(.created_at) | last | "\(.status) \(.conclusion) \(.html_url)"')
            set -- $run
            if [ "$1" = "completed" ]; then
              if [ "$2" = "success" ]; then echo "Android build prošao: $3"; break; fi
              echo "::error::Android build za ovaj commit nije prošao ($2): $3"; exit 1
            fi
            sleep 30
          done

      - name: Release na Sogli031/rad
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.RAD_RELEASE_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::Nedostaje tajna RAD_RELEASE_TOKEN"; exit 1; fi
          # Jedini asset je rad.apk: releases/latest/download/rad.apk uvek vodi na najnoviju verziju,
          # a provera ažuriranja u aplikaciji i Obtainium traže baš taj fajl.
          gh release create "v$VERSION" release-out/rad.apk \
            --repo "$PUBLIC_REPO" \
            --title "Verzija $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: Obriši ključ
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/../keystore" local.properties
